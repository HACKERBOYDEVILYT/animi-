<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AnimeZone</title>
    <style>
        body { background-color: #0f0f0f; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: #1f1f1f; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: #1a1a1a; border-radius: 8px; overflow: hidden; transition: transform 0.2s; cursor: pointer; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .card-body { padding: 10px; }
        .card-title { font-size: 16px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { background: #e50914; color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; float: right; }
    </style>
</head>
<body>
    <header>
        <h2>🎬 AnimeZone</h2>
        <a href="/admin" style="color: white; text-decoration: none;">Admin Panel</a>
    </header>
    
    <div class="container">
        <h3>Latest Updates</h3>
        <div class="grid">
            {% for anime in animes %}
            <div class="card" onclick="window.location.href='/anime/{{ anime.slug }}'">
                <img src="{{ anime.image_url }}" alt="{{ anime.title }}">
                <div class="card-body">
                    <span class="badge">{{ anime.status }}</span>
                    <div class="card-title">{{ anime.title }}</div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
