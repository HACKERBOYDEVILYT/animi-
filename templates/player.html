<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch {{ anime.title }} - Ep {{ episode_number }}</title><style>
body{margin:0;background:#05060a;color:white;font:15px system-ui}.top{padding:16px}.player{width:min(1100px,96vw);margin:20px auto;aspect-ratio:16/9;background:#111827;border-radius:12px;overflow:hidden}
iframe{width:100%;height:100%;border:0}.notice{text-align:center;padding:40px 18px;color:#c5cada}
</style></head><body><div class="top"><a href="{{ url_for('anime_detail',slug=anime.slug) }}">← {{ anime.title }}</a></div>
{% if source_url %}<div class="player"><iframe src="{{ source_url }}" title="{{ anime.title }} episode {{ episode_number }}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
{% else %}<div class="notice"><h2>Episode {{ episode_number }}</h2><p>এই পর্বের জন্য এখনো কোনো অনুমোদিত video source যুক্ত করা হয়নি।</p><p>An authorized stream URL can be configured from the admin panel.</p></div>{% endif %}
</body></html>
