<!DOCTYPE html>
<html>
<head>
    <title>Watch {{ episode.anime.title }} - Ep {{ episode.episode_number }}</title>
    <style>
        body { background: #000; margin: 0; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .back-btn { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0,0,0,0.7); color: white; padding: 10px; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <a href="/anime/{{ episode.anime.slug }}" class="back-btn">⬅ Back to Anime</a>
    
    {% if source_url %}
        <div class="video-container">
            <iframe src="{{ source_url }}" allowfullscreen autoplay></iframe>
        </div>
    {% else %}
        <h1 style="text-align:center; margin-top: 50px;">Loading Server...</h1>
    {% endif %}
</body>
</html>
